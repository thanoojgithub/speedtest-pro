<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="60%" stop-color="#222222" />
      <stop offset="100%" stop-color="#FF0000" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF0000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Clean Minimalist Outer Precision Ring -->
  <circle cx="32" cy="32" r="30" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
  
  <!-- Subtle Inactive Arc Track -->
  <path d="M 14 44 A 22 22 0 1 1 50 44" fill="none" stroke="#F0F0F0" stroke-width="4.5" stroke-linecap="round"/>

  <!-- High-Speed Dynamic Pure Red Velocity Arc -->
  <path d="M 14 44 A 22 22 0 0 1 47 18" fill="none" stroke="#FF0000" stroke-width="5" stroke-linecap="round" filter="url(#subtleGlow)"/>

  <!-- Center Hub with Red Core Accent -->
  <circle cx="32" cy="32" r="5" fill="#000000" />
  <circle cx="32" cy="32" r="2.5" fill="#FF0000" />

  <!-- Aerodynamic Modern Speed Needle pointing high -->
  <path d="M 31 32 L 32.5 13 L 33.5 32 Z" fill="#000000" stroke="#000000" stroke-width="0.8" stroke-linejoin="round" transform="rotate(38 32 32)"/>

  <!-- Fast.com Style Speed Streaks -->
  <line x1="16" y1="23" x2="21" y2="21" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="15" x2="25" y2="19" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="15" x2="39" y2="19" stroke="#FF0000" stroke-width="2.5" stroke-linecap="round"/>
</svg>
