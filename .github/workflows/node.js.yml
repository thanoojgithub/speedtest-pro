name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # REMOVED: cache: 'npm' because we have no package-lock.json
        
    # REMOVED: npm ci (This is what caused your error)
    
    - run: npm run build --if-present
    
    # Since you don't have a 'test' script in package.json, 
    # we wrap this in a conditional or remove it.
    - run: npm test --if-present
